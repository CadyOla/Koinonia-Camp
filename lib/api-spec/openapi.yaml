openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Koinonia Camp Registration API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: registrations
    description: Camp registration operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /registrations:
    get:
      operationId: listRegistrations
      tags: [registrations]
      summary: List all registrations (admin)
      parameters:
        - name: branch
          in: query
          schema:
            type: string
        - name: accommodation
          in: query
          schema:
            type: string
        - name: feeding
          in: query
          schema:
            type: string
        - name: transport
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registration"

    post:
      operationId: submitRegistration
      tags: [registrations]
      summary: Submit or update a registration
      description: Creates a new registration or updates an existing one if phone number + full name match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "200":
          description: Registration created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /registrations/stats:
    get:
      operationId: getRegistrationStats
      tags: [registrations]
      summary: Get registration summary statistics
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStats"

  /registrations/{id}:
    get:
      operationId: getRegistration
      tags: [registrations]
      summary: Get a single registration by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Registration:
      type: object
      required:
        - id
        - referenceNumber
        - fullName
        - phoneNumber
        - gender
        - branch
        - ministries
        - emergencyContactName
        - emergencyContactNumber
        - accommodationPreference
        - feedingPreference
        - transportPreference
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        referenceNumber:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
        email:
          type: ["string", "null"]
        gender:
          type: string
        branch:
          type: string
        ministries:
          type: array
          items:
            type: string
        emergencyContactName:
          type: string
        emergencyContactNumber:
          type: string
        accommodationPreference:
          type: string
        roomTypePreference:
          type: ["string", "null"]
        lodgingType:
          type: ["string", "null"]
        roommatePreferences:
          type: ["string", "null"]
        specialNeeds:
          type: ["string", "null"]
        feedingPreference:
          type: string
        transportPreference:
          type: string
        paymentStatus:
          type: ["string", "null"]
        roomAssignment:
          type: ["string", "null"]
        busAssignment:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    RegistrationInput:
      type: object
      required:
        - fullName
        - phoneNumber
        - gender
        - branch
        - ministries
        - emergencyContactName
        - emergencyContactNumber
        - accommodationPreference
        - feedingPreference
        - transportPreference
      properties:
        fullName:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          minLength: 1
        email:
          type: string
        gender:
          type: string
        branch:
          type: string
        ministries:
          type: array
          items:
            type: string
        emergencyContactName:
          type: string
          minLength: 1
        emergencyContactNumber:
          type: string
          minLength: 1
        accommodationPreference:
          type: string
        roomTypePreference:
          type: string
        lodgingType:
          type: string
        roommatePreferences:
          type: string
        specialNeeds:
          type: string
        feedingPreference:
          type: string
        transportPreference:
          type: string

    RegistrationStats:
      type: object
      required:
        - total
        - resident
        - nonResident
        - churchFeeding
        - selfFeeding
        - churchBus
        - selfTransport
        - byBranch
        - byMinistry
      properties:
        total:
          type: integer
        resident:
          type: integer
        nonResident:
          type: integer
        churchFeeding:
          type: integer
        selfFeeding:
          type: integer
        churchBus:
          type: integer
        selfTransport:
          type: integer
        byBranch:
          type: array
          items:
            $ref: "#/components/schemas/CountByLabel"
        byMinistry:
          type: array
          items:
            $ref: "#/components/schemas/CountByLabel"

    CountByLabel:
      type: object
      required:
        - label
        - count
      properties:
        label:
          type: string
        count:
          type: integer

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
